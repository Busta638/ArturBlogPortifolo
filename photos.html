<script>
/* Clean GitHub Pages URL: hide the .html filename in the address bar. */
(() => {
  const cleanPath = '/photos';
  const currentPath = window.location.pathname;
  const expectedFile = 'photos.html';

  if (currentPath.endsWith("/" + expectedFile) || currentPath === expectedFile) {
    window.history.replaceState(null, "", cleanPath + window.location.search + window.location.hash);
  }
})();
</script>

<script>
(() => {
  try {
    // saves this in direction so this part can reuse the same value instead of finding/calculating it again
    const direction = sessionStorage.getItem("panorama-direction");
    // only runs this part when the condition is true so it doesnt fire in the wrong state
    if (direction === "next" || direction === "prev") {
      // puts/reads a small value in a data-* attribute so css or other javascript can react to it
      document.documentElement.dataset.panoramaDirection = direction;
    }
  } catch (error) {}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos — Artur Tigirlas</title>
<style>
*{box-sizing:border-box}
:root{
  /* pure black and white on purpose. no tinted greys so the ink actually reads as ink */
  --paper:#fff;
  --ink:#000;
  --muted:#6b6b6b;
}
body.night{
  --paper:#000;
  --ink:#fff;
  --muted:#9a9a9a;
}
html{background:var(--paper);scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  color:var(--ink);
  background:var(--paper);
  font-family:"Times New Roman",Times,serif;
  transition:background .35s ease,color .35s ease;
}
a,button{font:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:6px}

/* isolation keeps the title blend inside this box so it blends with the paper color and nothing else */
.shell{position:relative;isolation:isolate;background:var(--paper);width:min(1380px,calc(100% - 40px));margin:auto;padding:18px 0 56px;transition:background .35s ease}

.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:10px 0}
.back{color:var(--ink);text-decoration:none;justify-self:start}
.back:hover{text-decoration:underline;text-underline-offset:5px}
.mark{justify-self:end;color:var(--muted);font-size:15px}
.theme-switch{display:flex;align-items:center;gap:20px}
.theme-switch button{position:relative;padding:4px 0 7px;border:0;background:transparent;color:var(--muted);cursor:pointer;transition:color .18s ease}
.theme-switch button::after{content:"";position:absolute;left:0;right:0;bottom:1px;height:1px;background:currentColor;transform:scaleX(0);transition:transform .18s ease}
.theme-switch button:hover{color:var(--ink)}
.theme-switch button.active{color:var(--ink);font-weight:700}
.theme-switch button.active::after{transform:scaleX(1)}

/* the title is white with blend-mode difference: black on the white page, flips to white wherever it crosses the ink */
h1{
  position:relative;
  z-index:2;
  margin:clamp(24px,4vw,56px) 0 0 -.05em;
  color:#fff;
  mix-blend-mode:difference;
  font-size:clamp(100px,26vw,380px);
  font-weight:400;
  line-height:.76;
  letter-spacing:-.05em;
  pointer-events:none;
  user-select:none;
}

/* chapters sit under the bottom of the title so the word cuts across the first drawing */
.album{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:1.3fr 1fr;
  gap:clamp(28px,5vw,80px);
  align-items:start;
  margin-top:calc(-1 * clamp(56px,11vw,170px));
}
.chapter{display:block;color:var(--ink);text-decoration:none}

/* keep the second option slightly lower for the editorial offset,
   but much higher than the previous smart-ink version */
.chapter:last-child{margin-top:clamp(40px,7vw,110px)}

.frame{position:relative;overflow:hidden;aspect-ratio:5/4}
.chapter:last-child .frame{aspect-ratio:4/5}
/* a vertical photo in the first chapter gets a tall frame, a bit taller than the landscape one so it has more room */
.chapter:first-child .frame.portrait{aspect-ratio:4/5;width:72%}
.frame canvas,.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.frame.no-clean-ink::after{content:"";position:absolute;inset:12% 8%;border-top:1px solid color-mix(in srgb,var(--ink) 18%,transparent);border-bottom:1px solid color-mix(in srgb,var(--ink) 10%,transparent);opacity:.55}

/* the ink layer is black on transparent. in night mode it flips to white lines on black */
.frame canvas{opacity:0;transition:opacity .7s ease}
.frame canvas.ready{opacity:1}
body.night .frame canvas{filter:invert(1)}

/* the real photo waits underneath in black and white and only shows when you hover the chapter */
.frame img{opacity:0;filter:grayscale(1) contrast(1.15);transition:opacity .5s ease}
.chapter:hover .frame canvas.ready,.chapter:focus-visible .frame canvas.ready{opacity:0}
.chapter:hover .frame img,.chapter:focus-visible .frame img{opacity:1}

/* if the canvas cant read the photo (like file://) this keeps the same idea with a plain css filter */
.frame img.fallback{
  opacity:1;
  filter:grayscale(1) contrast(2.15) brightness(1.58);
  mix-blend-mode:multiply;
}
body.night .frame img.fallback{
  filter:grayscale(1) contrast(2.15) brightness(1.58) invert(1);
  mix-blend-mode:screen;
}

.chapter h2{margin:20px 0 6px;font-size:clamp(32px,4.2vw,60px);font-weight:400;line-height:1;letter-spacing:-.045em}
.chapter p{max-width:38ch;margin:0;color:var(--muted);font-size:18px;line-height:1.55}
.open{display:inline-block;margin-top:16px;border-bottom:1px solid var(--ink);padding-bottom:3px;transition:padding .2s ease}
.chapter:hover .open{padding-right:18px}

.footer{margin-top:clamp(64px,9vw,120px);color:var(--muted);font-size:14px}

@media(max-width:760px){
  .topbar{grid-template-columns:1fr auto}
  .mark{display:none}
  .album{grid-template-columns:1fr;width:100%;margin-left:0;margin-top:calc(-1 * clamp(30px,10vw,60px))}
  .chapter:first-child,.chapter:last-child{transform:none}
  .chapter:last-child{margin-top:0}
  .chapter:first-child .frame.portrait{width:100%}
}
@media(prefers-reduced-motion:reduce){
  .frame canvas,.frame img,.open,body,.shell{transition:none}
}
/* TRUE HORIZONTAL CROSS-PAGE PANORAMA */
/* TRUE HORIZONTAL CROSS-PAGE PANORAMA */
@view-transition { navigation: auto; }

::view-transition-group(root) {
  animation-duration: 920ms;
  animation-timing-function: cubic-bezier(.22,.82,.22,1);
}

::view-transition-image-pair(root) {
  /* makes a separate stacking/blending area so effects here dont accidentally mix with the whole page */
  isolation: isolate;
  /* decides what happens if content goes outside the box. hidden clips it and auto can make it scroll */
  overflow: hidden;
}

::view-transition-old(root),
::view-transition-new(root) {
  animation-duration: 920ms;
  animation-timing-function: cubic-bezier(.22,.82,.22,1);
  /* tells this layer to blend its colors with whats underneath instead of just sitting normally on top */
  mix-blend-mode: normal;
  /* controls the height. vh/percent/calc lets it follow the screen or parent instead of one fixed size */
  height: 100%;
}

html[data-panorama-direction="next"]::view-transition-old(root) {
  /* runs one of the keyframes. the time/easing/repeat parts after the name control how it plays */
  animation:
    panorama-old-left 920ms cubic-bezier(.22,.82,.22,1),
    panorama-old-color-hard 920ms ease-in-out;
}
html[data-panorama-direction="next"]::view-transition-new(root) {
  /* runs one of the keyframes. the time/easing/repeat parts after the name control how it plays */
  animation:
    panorama-new-right 920ms cubic-bezier(.22,.82,.22,1),
    panorama-new-color-hard 920ms ease-in-out;
}
html[data-panorama-direction="prev"]::view-transition-old(root) {
  /* runs one of the keyframes. the time/easing/repeat parts after the name control how it plays */
  animation:
    panorama-old-right 920ms cubic-bezier(.22,.82,.22,1),
    panorama-old-color-hard 920ms ease-in-out;
}
html[data-panorama-direction="prev"]::view-transition-new(root) {
  /* runs one of the keyframes. the time/easing/repeat parts after the name control how it plays */
  animation:
    panorama-new-left 920ms cubic-bezier(.22,.82,.22,1),
    panorama-new-color-hard 920ms ease-in-out;
}

::view-transition-image-pair(root)::after {
  content:"";
  /* decides how this is positioned. relative keeps its spot, absolute/fixed/sticky lets me place it more manually */
  position:absolute;
  /* sets top right bottom and left together. 0 usually stretches this across the whole parent/screen */
  inset:-4%;
  /* decides if this layer can catch clicks. none lets the click go through to stuff under it */
  pointer-events:none;
  /* builds the background. multiple gradients/images stack in the order theyre written here */
  background:
    linear-gradient(
      90deg,
      rgba(17,34,59,.42) 0%,
      rgba(74,16,20,.30) 30%,
      rgba(214,72,56,.58) 49%,
      rgba(242,174,133,.42) 54%,
      rgba(28,53,80,.34) 70%,
      transparent 100%
    );
  /* tells this layer to blend its colors with whats underneath instead of just sitting normally on top */
  mix-blend-mode:screen;
  /* changes the finished layer with stuff like blur brightness contrast and saturation */
  filter:blur(7px) saturate(1.28);
  /* controls how see-through the whole layer is. 0 is invisible and 1 is fully visible */
  opacity:0;
  /* runs one of the keyframes. the time/easing/repeat parts after the name control how it plays */
  animation:panoramaBlendFlashHard 920ms ease-in-out;
}

::view-transition-image-pair(root)::before {
  content:"";
  /* decides how this is positioned. relative keeps its spot, absolute/fixed/sticky lets me place it more manually */
  position:absolute;
  /* sets top right bottom and left together. 0 usually stretches this across the whole parent/screen */
  inset:0;
  /* decides if this layer can catch clicks. none lets the click go through to stuff under it */
  pointer-events:none;
  /* builds the background. multiple gradients/images stack in the order theyre written here */
  background:
    radial-gradient(
      ellipse at 50% 50%,
      rgba(255,212,186,.30) 0%,
      rgba(194,49,37,.24) 24%,
      rgba(19,35,60,.18) 48%,
      transparent 72%
    );
  /* tells this layer to blend its colors with whats underneath instead of just sitting normally on top */
  mix-blend-mode:color-dodge;
  /* controls how see-through the whole layer is. 0 is invisible and 1 is fully visible */
  opacity:0;
  /* runs one of the keyframes. the time/easing/repeat parts after the name control how it plays */
  animation:panoramaCenterBloomHard 920ms ease-in-out;
}

@keyframes panorama-old-left { from{transform:translateX(0)} to{transform:translateX(-100%)} }
@keyframes panorama-new-right { from{transform:translateX(100%)} to{transform:translateX(0)} }
@keyframes panorama-old-right { from{transform:translateX(0)} to{transform:translateX(100%)} }
@keyframes panorama-new-left { from{transform:translateX(-100%)} to{transform:translateX(0)} }

@keyframes panorama-old-color-hard {

  /* one point in the animation. css smoothly fills in the movement between this state and the next one */

}
@keyframes panoramaBlendFlashHard {
  /* one point in the animation. css smoothly fills in the movement between this state and the next one */
  0%,100%{opacity:0}
  /* one point in the animation. css smoothly fills in the movement between this state and the next one */
  28%{opacity:.20}
  /* one point in the animation. css smoothly fills in the movement between this state and the next one */
  45%{opacity:.62}
  /* one point in the animation. css smoothly fills in the movement between this state and the next one */
  54%{opacity:.88}
  /* one point in the animation. css smoothly fills in the movement between this state and the next one */
  66%{opacity:.42}
  /* one point in the animation. css smoothly fills in the movement between this state and the next one */
  78%{opacity:.12}
}
@keyframes panoramaCenterBloomHard {
  /* one point in the animation. css smoothly fills in the movement between this state and the next one */
  0%,100%{opacity:0;transform:scale(.96)}
  /* one point in the animation. css smoothly fills in the movement between this state and the next one */
  42%{opacity:.18;transform:scale(1)}
  /* one point in the animation. css smoothly fills in the movement between this state and the next one */

}

/* Fallback when cross-document View Transitions are unavailable. */
html.panorama-fallback-next body {
  /* runs one of the keyframes. the time/easing/repeat parts after the name control how it plays */
  animation:fallback-enter-right 680ms cubic-bezier(.22,.82,.22,1) both;
}
html.panorama-fallback-prev body {
  /* runs one of the keyframes. the time/easing/repeat parts after the name control how it plays */
  animation:fallback-enter-left 680ms cubic-bezier(.22,.82,.22,1) both;
}
body.panorama-fallback-exit-next {
  /* runs one of the keyframes. the time/easing/repeat parts after the name control how it plays */
  animation:fallback-exit-left 680ms cubic-bezier(.22,.82,.22,1) both;
}
body.panorama-fallback-exit-prev {
  /* runs one of the keyframes. the time/easing/repeat parts after the name control how it plays */
  animation:fallback-exit-right 680ms cubic-bezier(.22,.82,.22,1) both;
}
@keyframes fallback-enter-right { from{transform:translateX(18vw);opacity:.72} to{transform:none;opacity:1} }
@keyframes fallback-enter-left { from{transform:translateX(-18vw);opacity:.72} to{transform:none;opacity:1} }
@keyframes fallback-exit-left { from{transform:none;opacity:1} to{transform:translateX(-18vw);opacity:.72} }
@keyframes fallback-exit-right { from{transform:none;opacity:1} to{transform:translateX(18vw);opacity:.72} }

@media(prefers-reduced-motion:reduce) {
  ::view-transition-group(root),
  ::view-transition-old(root),
  ::view-transition-new(root),
  html.panorama-fallback-next body,
  html.panorama-fallback-prev body,
  body.panorama-fallback-exit-next,
  body.panorama-fallback-exit-prev {
    animation-duration:.01ms!important;
  }
}

<script>
function shuffled(items){return [...items].sort(()=>Math.random()-.5)}
const allPhotos=Array.isArray(window.PHOTOS)
  ? window.PHOTOS
  : [];

function previewSrc(photo){
  const src=String(photo?.src||"").replace(/\\/g,"/");
  return src.startsWith("photos/") ? `photos/${src}` : `photos/photos/${src}`;
}

/* turns a photo into black ink on transparent: levels it, keeps the darkest tones solid, and draws edges wherever a pixel is darker than the area around it */
/* tone controls for the ink. these three decide how heavy the drawing feels */
/* photos that are mostly black arent good for this page. if more than MAX_DARK_SHARE of a photo is darker than DARK_LEVEL, the frame tries another photo */
const MAX_DARK_SHARE=.58;      // allow darker originals if the final ink still looks clean
const MAX_INK_SHARE=.30;        // ideal final drawing: overall visible ink
const MAX_HEAVY_INK=.12;        // ideal final drawing: near-solid ink
const MAX_LOCAL_BLACK=.40;      // ideal final drawing: worst large local region
const MAX_COMPONENT=.16;        // ideal final drawing: biggest connected black blob
const MIN_INK_SHARE=.008;       // avoid drawings that disappear completely
const MAX_TRIES=120;            // search deeper through the archive before settling
const DARK_LEVEL=45;

const TONE_SOFTEN=.80;         // keep enough detail so the drawing does not disappear
const DENSE_RELIEF=.76;        // still thin dense areas, but less aggressively
const EDGE_FEATHER=.11;        // dissolve edges into the page

function inkify(img){
  const maxW=1100;
  const scale=Math.min(1,maxW/img.naturalWidth);
  const w=Math.max(2,Math.round(img.naturalWidth*scale));
  const h=Math.max(2,Math.round(img.naturalHeight*scale));
  const canvas=document.createElement("canvas");
  canvas.width=w;
  canvas.height=h;
  const ctx=canvas.getContext("2d");
  ctx.drawImage(img,0,0,w,h);

  // Throws on file:// / unreadable cross-origin images; caller uses fallback.
  const data=ctx.getImageData(0,0,w,h);
  const px=data.data;
  const lum=new Float32Array(w*h);

  for(let i=0;i<w*h;i++){
    lum[i]=px[i*4]*.299+px[i*4+1]*.587+px[i*4+2]*.114;
  }

  // share of the photo that is basically black, measured before the exposure gets evened out
  let dark=0;
  for(let i=0;i<lum.length;i++)if(lum[i]<DARK_LEVEL)dark++;
  canvas.darkShare=dark/lum.length;

  // Normalize exposure so bright and dark photos behave more similarly.
  const hist=new Uint32Array(256);
  for(let i=0;i<lum.length;i++)hist[Math.max(0,Math.min(255,lum[i]|0))]++;
  const percentile=p=>{
    let sum=0;
    const target=lum.length*p;
    for(let v=0;v<256;v++){
      sum+=hist[v];
      if(sum>=target)return v;
    }
    return 255;
  };
  const lo=percentile(.02);
  const hi=Math.max(percentile(.985),lo+1);
  for(let i=0;i<lum.length;i++){
    lum[i]=Math.max(0,Math.min(255,(lum[i]-lo)/(hi-lo)*255));
  }

  // Integral image = cheap local averages at two different scales.
  const stride=w+1;
  const integral=new Float64Array(stride*(h+1));
  const integralSq=new Float64Array(stride*(h+1));
  for(let y=0;y<h;y++){
    let row=0,rowSq=0;
    for(let x=0;x<w;x++){
      const v=lum[y*w+x];
      row+=v;
      rowSq+=v*v;
      const pos=(y+1)*stride+x+1;
      integral[pos]=integral[y*stride+x+1]+row;
      integralSq[pos]=integralSq[y*stride+x+1]+rowSq;
    }
  }

  function boxStats(x,y,r){
    const x0=Math.max(0,x-r),y0=Math.max(0,y-r);
    const x1=Math.min(w,x+r+1),y1=Math.min(h,y+r+1);
    const count=(x1-x0)*(y1-y0);
    const a=y0*stride+x0,b=y0*stride+x1,c=y1*stride+x0,d=y1*stride+x1;
    const sum=integral[d]-integral[b]-integral[c]+integral[a];
    const sumSq=integralSq[d]-integralSq[b]-integralSq[c]+integralSq[a];
    const mean=sum/count;
    const variance=Math.max(0,sumSq/count-mean*mean);
    return {mean,sd:Math.sqrt(variance)};
  }

  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const smoothstep=(a,b,v)=>{
    const t=clamp((v-a)/(b-a),0,1);
    return t*t*(3-2*t);
  };

  const fineR=1;
  const mediumR=Math.max(3,Math.round(w/180));
  const wideR=Math.max(14,Math.round(w/24));
  const output=new Uint8ClampedArray(px.length);
  const inkMap=new Float32Array(w*h);

  // Sobel + local contrast. The key part: broad dark areas get suppressed when
  // they do not differ much from their neighbourhood. Strong boundaries survive.
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const i=y*w+x;
      const xm=Math.max(0,x-1),xp=Math.min(w-1,x+1);
      const ym=Math.max(0,y-1),yp=Math.min(h-1,y+1);

      const tl=lum[ym*w+xm],tc=lum[ym*w+x],tr=lum[ym*w+xp];
      const ml=lum[y*w+xm],                 mr=lum[y*w+xp];
      const bl=lum[yp*w+xm],bc=lum[yp*w+x],br=lum[yp*w+xp];

      const gx=(-tl-2*ml-bl)+(tr+2*mr+br);
      const gy=(-tl-2*tc-tr)+(bl+2*bc+br);
      const gradient=Math.sqrt(gx*gx+gy*gy)/4;

      const fine=boxStats(x,y,fineR);
      const medium=boxStats(x,y,mediumR);
      const wide=boxStats(x,y,wideR);

      // Difference from local surroundings finds actual shapes/details.
      const localDifference=Math.abs(fine.mean-medium.mean);
      const broadDifference=Math.abs(medium.mean-wide.mean);

      // Texture score helps preserve wheel spokes, outlines, branches, signs, etc.
      const detail=gradient*.70 + localDifference*.75 + medium.sd*.34 + broadDifference*.22;

      // Big uniformly dark regions are usually background/shadow. Fade them harder.
      const uniformDark=1-smoothstep(7,24,wide.sd);
      const darkField=1-smoothstep(42,110,wide.mean);
      const backgroundPenalty=uniformDark*darkField;

      // Important isolated dark details can still survive if edge/detail is strong.
      let score=detail-(backgroundPenalty*28);

      // Smooth alpha ramp instead of binary black/transparent.
      // Low detail vanishes, medium detail becomes faint ink, strongest edges go solid black.
      let alpha=smoothstep(11,42,score);
      alpha=Math.pow(alpha,.78);

      // A second soft fade removes weak interior texture while preserving the strongest contour.
      const contourBoost=smoothstep(24,70,gradient+localDifference*.6);
      alpha*=.55+.45*contourBoost;

      // Near-white paper areas with almost no contrast disappear completely.
      if(wide.mean>226 && detail<22)alpha*=.18;

      // Keep truly strong contour lines crisp.
      if(gradient>62 || (localDifference>36 && medium.sd>18))alpha=Math.max(alpha,.92);

      inkMap[i]=clamp(alpha,0,1);
    }
  }

  // second pass: where ink piles up into a heavy dark patch, thin it out so the whole thing isnt harsh
  const inkIntegral=new Float64Array(stride*(h+1));
  for(let y=0;y<h;y++){
    let row=0;
    for(let x=0;x<w;x++){
      row+=inkMap[y*w+x];
      inkIntegral[(y+1)*stride+x+1]=inkIntegral[y*stride+x+1]+row;
    }
  }
  const densityR=Math.max(12,Math.round(w/36));
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const i=y*w+x;
      const x0=Math.max(0,x-densityR),y0=Math.max(0,y-densityR);
      const x1=Math.min(w,x+densityR+1),y1=Math.min(h,y+densityR+1);
      const sum=inkIntegral[y1*stride+x1]-inkIntegral[y0*stride+x1]-inkIntegral[y1*stride+x0]+inkIntegral[y0*stride+x0];
      const density=sum/((x1-x0)*(y1-y0));

      let alpha=inkMap[i]*(1-DENSE_RELIEF*smoothstep(.45,.85,density));
      alpha*=TONE_SOFTEN;

      // third pass: the sides of the picture fade into the page instead of ending in a hard corner to corner edge
      const fadeX=Math.min(x,w-1-x)/(w*EDGE_FEATHER);
      const fadeY=Math.min(y,h-1-y)/(h*EDGE_FEATHER);
      alpha*=smoothstep(0,1,Math.min(fadeX,fadeY));

      const out=i*4;
      output[out]=0;
      output[out+1]=0;
      output[out+2]=0;
      output[out+3]=Math.round(clamp(alpha,0,1)*255);
    }
  }

  data.data.set(output);
  ctx.putImageData(data,0,0);

  // FINAL artwork quality metrics. This is the important part: a photo is judged
  // by the ink drawing the visitor will actually see, not only by the source exposure.
  let alphaTotal=0,heavyInk=0;
  const alphaMap=new Float32Array(w*h);
  for(let i=0;i<w*h;i++){
    const a=output[i*4+3]/255;
    alphaMap[i]=a;
    alphaTotal+=a;
    if(a>.78)heavyInk++;
  }
  canvas.inkShare=alphaTotal/(w*h);
  canvas.heavyInkShare=heavyInk/(w*h);

  // Integral alpha map -> worst large-area density. A dark road/wall/car interior
  // cannot hide behind a low global average anymore.
  const aStride=w+1;
  const aIntegral=new Float64Array(aStride*(h+1));
  for(let y=0;y<h;y++){
    let row=0;
    for(let x=0;x<w;x++){
      row+=alphaMap[y*w+x];
      aIntegral[(y+1)*aStride+x+1]=aIntegral[y*aStride+x+1]+row;
    }
  }
  const regionMean=(x0,y0,x1,y1)=>{
    const A=y0*aStride+x0,B=y0*aStride+x1,C=y1*aStride+x0,D=y1*aStride+x1;
    return (aIntegral[D]-aIntegral[B]-aIntegral[C]+aIntegral[A]) / Math.max(1,(x1-x0)*(y1-y0));
  };
  const winW=Math.max(24,Math.round(w*.30));
  const winH=Math.max(24,Math.round(h*.30));
  const stepX=Math.max(10,Math.round(winW*.38));
  const stepY=Math.max(10,Math.round(winH*.38));
  let worstLocal=0;
  for(let y=0;y<h;y+=stepY){
    for(let x=0;x<w;x+=stepX){
      worstLocal=Math.max(worstLocal,regionMean(x,y,Math.min(w,x+winW),Math.min(h,y+winH)));
    }
  }
  canvas.localBlackShare=worstLocal;

  // Connected-component test on a downsampled binary ink mask. This directly catches
  // the failure from the screenshots: one enormous continuous black silhouette.
  const sampleStep=Math.max(2,Math.round(Math.max(w,h)/360));
  const sw=Math.ceil(w/sampleStep),sh=Math.ceil(h/sampleStep);
  const mask=new Uint8Array(sw*sh);
  let blackCells=0;
  for(let sy=0;sy<sh;sy++){
    for(let sx=0;sx<sw;sx++){
      const pxX=Math.min(w-1,sx*sampleStep);
      const pxY=Math.min(h-1,sy*sampleStep);
      const on=alphaMap[pxY*w+pxX]>.56;
      if(on){mask[sy*sw+sx]=1;blackCells++;}
    }
  }
  const seen=new Uint8Array(mask.length);
  let largest=0;
  const stack=[];
  for(let i=0;i<mask.length;i++){
    if(!mask[i]||seen[i])continue;
    seen[i]=1;stack.push(i);let size=0;
    while(stack.length){
      const cur=stack.pop();size++;
      const x=cur%sw,y=(cur/sw)|0;
      const add=n=>{if(n>=0&&n<mask.length&&mask[n]&&!seen[n]){seen[n]=1;stack.push(n)}};
      if(x>0)add(cur-1);if(x<sw-1)add(cur+1);if(y>0)add(cur-sw);if(y<sh-1)add(cur+sw);
    }
    if(size>largest)largest=size;
  }
  canvas.componentShare=largest/Math.max(1,sw*sh);

  return canvas;
}

// loads one photo and makes its ink drawing. canvas stays null if the browser wont let us read the pixels
function loadInk(photo){
  return new Promise(resolve=>{
    const img=document.createElement("img");
    img.alt="";
    img.onload=()=>{
      let canvas=null;
      try{canvas=inkify(img)}catch(error){}
      resolve({photo,img,canvas});
    };
    img.onerror=()=>resolve(null);
    img.src=previewSrc(photo);
  });
}

// how black a photo is. measured from the pixels when the browser allows it, otherwise read from photo-darkness.js (made by make_photo_darkness.py), otherwise unknown
function darknessKey(photo){
  let src=String(photo?.src||"").replace(/\\/g,"/").replace(/^\.\//,"");
  while(src.toLowerCase().startsWith("photos/"))src=src.slice(7);
  try{return decodeURIComponent(src)}catch(error){return src}
}

function savedPhotoMetrics(photo){
  const table=window.PHOTO_DARKNESS||{};
  const key=darknessKey(photo);
  let saved=table[key];
  if(saved===undefined){
    const wanted=key.toLowerCase();
    const actual=Object.keys(table).find(k=>k.toLowerCase()===wanted);
    if(actual)saved=table[actual];
  }

  // v2 file was just a number. v3 stores {dark,ink,heavy}.
  if(typeof saved==="number")return {dark:saved,ink:null,heavy:null};
  if(saved&&typeof saved==="object")return {
    dark:typeof saved.dark==="number"?saved.dark:null,
    ink:typeof saved.ink==="number"?saved.ink:null,
    heavy:typeof saved.heavy==="number"?saved.heavy:null
  };
  return {dark:null,ink:null,heavy:null};
}

function savedCandidateLooksUsable(photo){
  const m=savedPhotoMetrics(photo);

  // Raw darkness is NOT a hard reject.
  // A photo can be 70% dark and still make a clean ink illustration if the dark
  // areas are smooth and do not turn into giant filled blobs.
  //
  // The cheap first pass only rejects photos whose estimated ink result is
  // already obviously too dense.
  if(m.ink!==null&&m.ink>.36)return false;
  if(m.heavy!==null&&m.heavy>.20)return false;
  return true;
}

function finalMetrics(result){
  if(!result.canvas)return null;
  return {
    dark:result.canvas.darkShare,
    ink:result.canvas.inkShare,
    heavy:result.canvas.heavyInkShare,
    local:result.canvas.localBlackShare,
    component:result.canvas.componentShare
  };
}

function finalDrawingPasses(m){
  return !!m &&
    // Final ink structure decides pass/fail. Original darkness does not.
    m.ink>=MIN_INK_SHARE && m.ink<=MAX_INK_SHARE &&
    m.heavy<=MAX_HEAVY_INK &&
    m.local<=MAX_LOCAL_BLACK &&
    m.component<=MAX_COMPONENT;
}

function acceptableDrawingPasses(m){
  // Second tier: still blocks the ugly screenshot-style black masses,
  // but allows darker originals when their final ink structure is clean.
  return !!m &&
    m.ink>=MIN_INK_SHARE && m.ink<=.38 &&
    m.heavy<=.17 &&
    m.local<=.52 &&
    m.component<=.22;
}

function qualityScore(m){
  // Connected black masses are punished hardest, then local density, then global ink.
  // Original darkness is only a tiny tie-breaker, never a rejection rule.
  return m.component*5.6 + m.local*3.5 + m.heavy*3.0 + m.ink*1.6 + m.dark*.02;
}

// Local file:// mode often blocks canvas pixel reads.
// When that happens, use the v3 metrics generated by the BAT instead of rejecting
// every image. Hosted/GitHub mode still uses the actual rendered canvas metrics.
function savedFallbackPasses(m, ideal=true){
  if(!m)return false;

  // Local file:// mode cannot inspect connected blobs in-browser, so the v3
  // estimated ink/heavy values are the gate. Raw source darkness is allowed.
  const inkOK=m.ink!==null && m.ink <= (ideal ? .20 : .28);
  const heavyOK=m.heavy!==null && m.heavy <= (ideal ? .085 : .135);

  return inkOK && heavyOK;
}

function savedFallbackScore(m){
  return
    (m.ink===null ? .28 : m.ink*2.6) +
    (m.heavy===null ? .14 : m.heavy*4.2) +
    // tiny penalty only so dark photos are not automatically buried
    (m.dark===null ? .02 : m.dark*.035);
}

function rankFromSavedMetrics(candidates){
  const scored=[];
  for(const photo of candidates){
    const metrics=savedPhotoMetrics(photo);
    if(metrics.ink===null || metrics.heavy===null)continue;
    if(!savedFallbackPasses(metrics,false))continue;
    scored.push({photo,metrics,score:savedFallbackScore(metrics)});
  }
  scored.sort((a,b)=>a.score-b.score);
  return scored;
}

function randomFromQualityBand(ranked, excludePhoto=null){
  const available=ranked.filter(item=>item.photo!==excludePhoto);
  if(!available.length)return null;

  // Keep quality under control, but do NOT always choose from the same top 10.
  // Use a broad quality band: up to the better ~45% of acceptable candidates,
  // capped at 80 photos so refreshes actually feel random.
  const bandSize=Math.min(
    80,
    Math.max(18, Math.ceil(available.length*.45))
  );
  const band=available.slice(0,bandSize);

  // Mild weighting toward cleaner results without making the first few dominate.
  // Squaring Math.random biases a little toward the front while still allowing
  // the whole band to appear.
  const index=Math.min(
    band.length-1,
    Math.floor(Math.pow(Math.random(),1.35)*band.length)
  );
  return band[index];
}

function loadPlainPhoto(photo){
  return new Promise(resolve=>{
    const img=document.createElement("img");
    img.alt="";
    img.onload=()=>resolve({photo,img,canvas:null});
    img.onerror=()=>resolve(null);
    img.src=previewSrc(photo);
  });
}

// FAST PATH:
// local file:// mode never attempts canvas. The BAT already analyzed all 1000+
// photos, so use those saved numbers to choose a clean candidate immediately.
// Hosted mode only runs the expensive canvas renderer on a tiny pre-ranked shortlist.
async function buildFrame(frame,candidates){
  const isLocalFile=location.protocol==="file:";
  const ranked=rankFromSavedMetrics(candidates);

  if(isLocalFile && ranked.length){
    // Choose from a much wider acceptable quality band so repeated refreshes do
    // not keep showing the same handful of photos.
    const pick=randomFromQualityBand(ranked);
    const result=pick ? await loadPlainPhoto(pick.photo) : null;
    if(!result)return null;

    frame.classList.toggle("portrait",result.img.naturalHeight>result.img.naturalWidth*1.05);
    frame.appendChild(result.img);
    result.img.classList.add("fallback");
    return result.photo;
  }

  // Hosted/GitHub: choose a RANDOM shortlist from the broad acceptable band,
  // then let the real canvas analysis make the final decision.
  let shortlist;
  if(ranked.length){
    const bandSize=Math.min(70,Math.max(18,Math.ceil(ranked.length*.40)));
    const band=shuffled(ranked.slice(0,bandSize));
    shortlist=band.slice(0,10).map(item=>item.photo);
  }else{
    shortlist=shuffled(candidates.filter(savedCandidateLooksUsable)).slice(0,10);
  }

  const loaded=(await Promise.all(shortlist.map(loadInk))).filter(Boolean);
  const ideal=[];
  const acceptable=[];
  let safest=null;

  for(const result of loaded){
    if(!result.canvas){
      const saved=savedPhotoMetrics(result.photo);
      result.qualityScore=savedFallbackScore(saved);
      if(!safest||result.qualityScore<safest.qualityScore)safest=result;
      if(savedFallbackPasses(saved,true))ideal.push(result);
      else if(savedFallbackPasses(saved,false))acceptable.push(result);
      continue;
    }

    const metrics=finalMetrics(result);
    result.metrics=metrics;
    result.qualityScore=qualityScore(metrics);
    if(!safest||result.qualityScore<safest.qualityScore)safest=result;
    if(finalDrawingPasses(metrics))ideal.push(result);
    else if(acceptableDrawingPasses(metrics))acceptable.push(result);
  }

  const pool=ideal.length?ideal:(acceptable.length?acceptable:(safest?[safest]:[]));
  if(!pool.length)return null;
  pool.sort((a,b)=>a.qualityScore-b.qualityScore);

  // Do not always pick the absolute mathematical winner. Anything in this
  // passing pool is visually acceptable, so randomize among up to 8 of them.
  pool.sort((a,b)=>a.qualityScore-b.qualityScore);
  const bestWindow=pool.slice(0,Math.min(8,pool.length));
  const best=bestWindow[Math.floor(Math.random()*bestWindow.length)];

  frame.classList.toggle("portrait",best.img.naturalHeight>best.img.naturalWidth*1.05);
  frame.appendChild(best.img);
  if(best.canvas){
    frame.appendChild(best.canvas);
    requestAnimationFrame(()=>best.canvas.classList.add("ready"));
  }else{
    best.img.classList.add("fallback");
  }
  return best.photo;
}

// Only use photos from the three visual groups that represent this landing page best.
// This keeps portraits, sports, girlfriend sets, random folders, etc. out of the ink artwork.
function landingPhotoAllowed(photo){
  const source=[
    photo?.event,
    photo?.eventSlug,
    photo?.src,
    photo?.file
  ].filter(Boolean).join(" ").toLowerCase();

  const allowedEventKeys=[
    // AUTOMOTIVE / PLANES
    "dmcc drift event",
    "import expo",
    "importfest",
    "toronto autoshow",
    "drift event",

    // STREET PHOTOGRAPHY / CITY / PLACE SETS
    "street photography in toronto",
    "monteal-2026",
    "montreal 2026",
    "ottawa-2026",
    "ottawa 2026",
    "burlington beach walk",
    "burlington bridge on the ice",
    "jordan harbour light",
    "photos from school",
    "walk to parking lot at school",

    // WILDLIFE / NATURE / HIKING
    "hiking with ben",
    "hiking with sister",
    "using my first camera while hiking"
  ];

  return allowedEventKeys.some(key=>source.includes(key));
}

const landingPhotos=allPhotos.filter(landingPhotoAllowed);
const picks=shuffled(landingPhotos.length ? landingPhotos : allPhotos);

if(picks.length){
  (async()=>{
    const first=await buildFrame(document.getElementById("travelPreview"),picks);
    // the second frame never reuses the first photo unless it is the only one
    const rest=picks.filter(photo=>photo!==first);
    await buildFrame(document.getElementById("selectedPreview"),rest.length?rest:picks);
  })();
}

const body=document.body;
const nightButton=document.getElementById("nightButton");
const glassButton=document.getElementById("glassButton");
function setTheme(theme){
  const night=theme==="night";
  body.classList.toggle("night",night);
  nightButton.classList.toggle("active",night);
  glassButton.classList.toggle("active",!night);
  try{localStorage.setItem("artur-theme",theme)}catch(error){}
}
nightButton.addEventListener("click",()=>setTheme("night"));
glassButton.addEventListener("click",()=>setTheme("glass"));
// this page is white by default, but a saved choice still wins
try{setTheme(localStorage.getItem("artur-theme")||"glass")}catch(error){setTheme("glass")}
</script>
<script>
(() => {
  // saves this in order so this part can reuse the same value instead of finding/calculating it again
  const order = ["home.html","photos.html","photos/travel-menu.html","photos/travel.html","photos/pond.html","photos/selected.html","projects.html","cv.html"];
  // this value changes while the page is running so i keep it in navigating instead of making it const
  let navigating = false;

  function normalizedPath(urlLike) {
    try {
      // saves this in url so this part can reuse the same value instead of finding/calculating it again
      const url = new URL(urlLike, location.href);
      // this value changes while the page is running so i keep it in path instead of making it const
      let path = url.pathname.replace(/^\/+/, "");
      // saves this in marker so this part can reuse the same value instead of finding/calculating it again
      const marker = "/photos/";
      // only runs this part when the condition is true so it doesnt fire in the wrong state
      if (path.includes(marker)) path = "photos/" + path.split(marker).pop();
      // if the check above wasnt true this is the other route the code takes
      else path = path.split("/").pop() || "home.html";
      // sends this result back and stops this function here so whatever called it can use the value
      return decodeURIComponent(path).toLowerCase();
    } catch (error) {
      // sends this result back and stops this function here so whatever called it can use the value
      return "";
    }
  }

  // saves this in currentPath so this part can reuse the same value instead of finding/calculating it again
  const currentPath = normalizedPath(location.href);
  // saves this in currentIndex so this part can reuse the same value instead of finding/calculating it again
  const currentIndex = order.indexOf(currentPath);
  // saves this in supportsCrossDocumentTransition so this part can reuse the same value instead of finding/calculating it again
  const supportsCrossDocumentTransition =
    CSS.supports("view-transition-name", "root");

  function directionFor(href) {
    // saves this in targetIndex so this part can reuse the same value instead of finding/calculating it again
    const targetIndex = order.indexOf(normalizedPath(href));
    // only runs this part when the condition is true so it doesnt fire in the wrong state
    if (targetIndex === -1 || currentIndex === -1) return "next";
    // sends this result back and stops this function here so whatever called it can use the value
    return targetIndex >= currentIndex ? "next" : "prev";
  }

  function navigateTo(href, direction) {
    // only runs this part when the condition is true so it doesnt fire in the wrong state
    if (navigating) return;
    navigating = true;

    try {
      // saves this for the current browser tab so the next page can read it during navigation
      sessionStorage.setItem("panorama-direction", direction);
    } catch (error) {}

    // puts/reads a small value in a data-* attribute so css or other javascript can react to it
    document.documentElement.dataset.panoramaDirection = direction;

    // only runs this part when the condition is true so it doesnt fire in the wrong state
    if (supportsCrossDocumentTransition) {
      location.href = href;
      // sends this result back and stops this function here so whatever called it can use the value
      return;
    }

    // adds this class. css watches the class and uses it to change the look/animation/state
    document.body.classList.add(
      direction === "next"
        ? "panorama-fallback-exit-next"
        : "panorama-fallback-exit-prev"
    );

    // waits a little before running the next part so the animation/state has time to happen first
    setTimeout(() => { location.href = href; }, 640);
  }

  // finds ALL matching html elements so javascript can loop through/change each one
  document.querySelectorAll('a[href]').forEach(link => {
    // waits for this browser/user action and then runs the function when it happens
    link.addEventListener("click", event => {
      // saves this in href so this part can reuse the same value instead of finding/calculating it again
      const href = link.getAttribute("href");
      // only runs this part when the condition is true so it doesnt fire in the wrong state
      if (
        !href ||
        href.startsWith("#") ||
        href.startsWith("javascript:") ||
        href.startsWith("mailto:") ||
        event.metaKey || event.ctrlKey || event.shiftKey || event.altKey ||
        event.button !== 0
      ) return;

      // saves this in targetPath so this part can reuse the same value instead of finding/calculating it again
      const targetPath = normalizedPath(href);
      // only runs this part when the condition is true so it doesnt fire in the wrong state
      if (!order.includes(targetPath)) return;

      // stops the browsers normal behavior here because im handling this interaction myself
      event.preventDefault();
      navigateTo(href, directionFor(href));
    });
  });

  // waits for this browser/user action and then runs the function when it happens
  addEventListener("pageshow", () => {
    try {
      // saves this in direction so this part can reuse the same value instead of finding/calculating it again
      const direction = sessionStorage.getItem("panorama-direction");
      // only runs this part when the condition is true so it doesnt fire in the wrong state
      if (!supportsCrossDocumentTransition && (direction === "next" || direction === "prev")) {
        // adds this class. css watches the class and uses it to change the look/animation/state
        document.documentElement.classList.add(
          direction === "prev" ? "panorama-fallback-prev" : "panorama-fallback-next"
        );
      }

      // waits a little before running the next part so the animation/state has time to happen first
      setTimeout(() => {
        sessionStorage.removeItem("panorama-direction");
        // puts/reads a small value in a data-* attribute so css or other javascript can react to it
        delete document.documentElement.dataset.panoramaDirection;
        // removes this class so the css/state goes back to the normal version
        document.documentElement.classList.remove(
          "panorama-fallback-next",
          "panorama-fallback-prev"
        );
      }, 1000);
    } catch (error) {}
  });
})();
</script>
