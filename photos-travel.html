<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Travel Photos</title>

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:#f6efe4;
}

.top{
  padding:20px 40px;
  cursor:pointer;
  font-weight:600;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:40px;
}

img{
  width:100%;
  border-radius:18px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
  transition:0.3s;
}

img:hover{
  transform: scale(1.03);
}
</style>
</head>

<body>

<div class="top" onclick="location.href='../photos.html'">
← Photos
</div>

<h2 style="padding-left:40px;">Travel</h2>

<div class="grid">

  <!-- replace with Google Drive images -->
  <img src="https://via.placeholder.com/500">
  <img src="https://via.placeholder.com/500">
  <img src="https://via.placeholder.com/500">

</div>

</body>
</html>
