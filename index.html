<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRXL Racing</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #020306;
      color: #f4f1eb;
      font-family: "Times New Roman", Times, serif;
      cursor: pointer;
    }

    .intro {
      position: fixed;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
      background: #020306;
      transition:
        transform 500ms ease,
        filter 500ms ease;
    }

    .bg-video {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(1.08) contrast(1.02) saturate(1.05);
      transform: scale(1.01);
      transition: transform 520ms ease, filter 520ms ease;
    }

    .intro::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(
          circle at 50% 46%,
          transparent 0 45%,
          rgba(0, 0, 0, 0.08) 68%,
          rgba(0, 0, 0, 0.28) 100%
        );
    }

    .intro::after {
      content: "";
      position: absolute;
      inset: -12%;
      z-index: 3;
      pointer-events: none;
      opacity: 0.12;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.18) 0 0.7px, transparent 0.9px);
      background-size: 8px 8px;
      mix-blend-mode: soft-light;
      animation: grain 0.5s steps(2) infinite;
    }

    .light-bloom {
      position: absolute;
      left: 50%;
      bottom: 18%;
      z-index: 4;
      width: 74vw;
      height: 20vh;
      transform: translateX(-50%);
      pointer-events: none;
      background:
        radial-gradient(ellipse at 34% 60%, rgba(255, 242, 205, 0.22), transparent 36%),
        radial-gradient(ellipse at 70% 60%, rgba(255, 40, 40, 0.19), transparent 42%);
      filter: blur(32px);
      opacity: 0.65;
      animation: breathe 4.8s ease-in-out infinite;
    }

    .content {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }

    .copy {
      transform: translateY(-3vh);
      text-shadow:
        0 2px 12px rgba(0, 0, 0, 0.9),
        0 0 30px rgba(0, 0, 0, 0.9);
      animation: appear 1.2s ease both;
    }

    .brand {
      margin: 0;
      font-size: clamp(42px, 7vw, 104px);
      font-weight: normal;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .prompt {
      margin: 18px 0 0;
      font-size: clamp(12px, 1.2vw, 17px);
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.78);
      animation: pulse 1.8s ease-in-out infinite;
    }


    .flash {
      position: absolute;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(circle at 48% 72%, rgba(255, 255, 255, 1) 0 8%, rgba(255, 246, 219, 0.75) 15%, rgba(255, 90, 60, 0.18) 30%, transparent 48%),
        rgba(255, 255, 255, 0.18);
      mix-blend-mode: screen;
    }

    body.entering .copy {
      opacity: 0;
      transition: opacity 130ms ease;
    }

    body.entering .intro {
      transform: scale(1.055);
      filter: brightness(1.18) contrast(1.06);
    }

    body.entering .light-bloom {
      transform: translateX(-50%) scale(1.22);
      opacity: 1;
      transition:
        transform 420ms ease,
        opacity 420ms ease;
    }

    body.entering .bg-video {
      transform: scale(1.055);
      filter: brightness(0.98) contrast(1.04) saturate(0.92);
    }

    body.entering .flash {
      animation: flash 520ms ease forwards;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.58;
      }

      50% {
        opacity: 1;
      }
    }

    @keyframes breathe {
      0%,
      100% {
        opacity: 0.5;
        transform: translateX(-50%) scale(1);
      }

      50% {
        opacity: 0.72;
        transform: translateX(-50%) scale(1.045);
      }
    }

    @keyframes grain {
      0% {
        transform: translate(0, 0);
      }

      25% {
        transform: translate(-1%, 1%);
      }

      50% {
        transform: translate(1%, -1%);
      }

      75% {
        transform: translate(0.5%, 0.5%);
      }

      100% {
        transform: translate(0, 0);
      }
    }

    @keyframes flash {
      0% {
        opacity: 0;
      }

      14% {
        opacity: 1;
      }

      45% {
        opacity: 0.72;
      }

      100% {
        opacity: 0;
      }
    }


    @media (max-width: 700px) {
      .brand {
        letter-spacing: 0.1em;
      }

      .prompt {
        letter-spacing: 0.17em;
      }

      /* Show the full video frame on narrow screens instead of cropping the headlights. */
      .bg-video {
        object-fit: contain;
        object-position: center center;
        transform: scale(0.98);
        background: #020306;
      }

      body.entering .bg-video {
        transform: scale(1.015);
      }

      .light-bloom {
        bottom: 24%;
        width: 94vw;
        height: 16vh;
        opacity: 0.5;
      }
    }


    @media (prefers-reduced-motion: reduce) {
      .intro::after,
      .light-bloom,
      .prompt {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="intro" id="intro">
    <video class="bg-video" autoplay muted loop playsinline preload="auto">
      <source src="assets/brxlopener2.mp4" type="video/mp4">
    </video>

    <div class="light-bloom"></div>

    <section class="content">
      <div class="copy">
        <h1 class="brand">BRXL Racing</h1>
        <p class="prompt">Press to Continue</p>
      </div>
    </section>

    <div class="flash"></div>
  </main>

  <script>
    const ENTER_URL = "home.html";

    let isEntering = false;

    function enterSite() {
      if (isEntering) {
        return;
      }

      isEntering = true;
      document.body.classList.add("entering");

      window.setTimeout(() => {
        window.location.href = ENTER_URL;
      }, 430);
    }

    document.addEventListener("click", enterSite);

    document.addEventListener("keydown", (event) => {
      if (
        event.key === "Enter" ||
        event.key === " " ||
        event.key === "Spacebar"
      ) {
        event.preventDefault();
        enterSite();
      }
    });
  </script>
</body>
</html>
