<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artur Tigirlas Web</title>

<style>

/* =========================
   BASE
========================= */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:'Segoe UI', Tahoma, sans-serif;
  color:#1f2a33;

  /* FIX: subtle white → cool tint so wave still shows */
  background: linear-gradient(to bottom right, #ffffff, #f6fbff);
  overflow-x:hidden;
}

/* =========================
   PIXEL MODE
========================= */

body.pixel{
  font-family: "Courier New", monospace;
}

body.pixel .card,
body.pixel .hero,
body.pixel .widget{
  backdrop-filter:none;
  border-radius:6px;
  box-shadow:none;
  border:1px solid #000;
}

body.pixel .btn{
  border-radius:0;
  background:#fff;
  border:1px solid #000;
}

.wave-bg{
  position:fixed;
  inset:-20%;
  z-index:-1;
  pointer-events:none;

  transform: rotate(-6deg) scale(1.25);
  opacity:0.65;
}

.wave-bg svg{
  width:100%;
  height:100%;
  display:block;
}

.container{
  display:grid;
  grid-template-columns: 1fr 240px;
  gap:22px;
  padding:28px;
}

.hero{
  grid-column:1 / -1;
  background:rgba(255,255,255,0.75);
  border:1px solid rgba(120,160,200,0.22);
  border-radius:18px;
  padding:28px;

  backdrop-filter: blur(14px);
  box-shadow:0 12px 30px rgba(60,120,180,0.10);
}

.blog{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.card{
  position:relative;
  background:rgba(255,255,255,0.70);
  border:1px solid rgba(120,160,200,0.22);
  border-radius:16px;
  overflow:hidden;

  backdrop-filter: blur(12px);
  box-shadow:0 10px 25px rgba(60,120,180,0.10);

  transition:0.25s ease;
}

.card:hover{
  transform:translateY(-3px);
}

/* header */
.card-header{
  padding:14px 16px;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.title{
  font-size:15px;
  font-weight:600;
}

.meta{
  font-size:12px;
  color:#5a6f80;
}

/* expand */
.card-body{
  max-height:0;
  opacity:0;
  overflow:hidden;
  padding:0 16px;
  transform:translateY(-6px);
  transition:0.4s ease;
}

.card.open .card-body{
  max-height:300px;
  opacity:1;
  padding:0 16px 16px 16px;
  transform:translateY(0);
}

/* =========================
   RIPPLE EFFECT
========================= */

.ripple{
  position:absolute;
  border-radius:50%;
  transform:scale(0);
  animation:rippleAnim 700ms ease-out;
  background:rgba(140,200,255,0.30);
  pointer-events:none;
}

@keyframes rippleAnim{
  to{
    transform:scale(6);
    opacity:0;
  }
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.widget{
  background:rgba(255,255,255,0.75);
  border:1px solid rgba(120,160,200,0.22);
  border-radius:14px;
  padding:14px;

  backdrop-filter: blur(12px);
}

.btn{
  display:block;
  padding:10px;
  margin-bottom:8px;
  border-radius:10px;
  background:#eef6ff;
  text-decoration:none;
  color:#1f2a33;
  font-size:13px;
}

.btn:hover{
  background:#dceeff;
}

/* =========================
   TOGGLE BUTTON
========================= */

.toggle-btn{
  position:fixed;
  top:16px;
  right:16px;
  z-index:10;

  padding:10px 12px;
  border-radius:10px;
  border:1px solid rgba(120,160,200,0.3);
  background:#fff;
  cursor:pointer;
}

/* =========================
   CALENDAR
========================= */

.calendar{
  font-size:12px;
  color:#4a6172;
}

/* =========================
   WAVES (FIXED GRADIENT VISIBILITY)
========================= */

.wave1{ fill: rgba(185,220,255,0.55); }
.wave2{ fill: rgba(140,200,255,0.25); }

</style>
</head>

<body>

<button class="toggle-btn" onclick="togglePixel()">Pixel Mode</button>

<!-- WAVES -->
<div class="wave-bg">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="none">

    <defs>

      <!-- FIXED GRADIENTS (VISIBLE BUT SUBTLE) -->
      <linearGradient id="waveGrad1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#eaf4ff" stop-opacity="0.9"/>
        <stop offset="40%" stop-color="#d6eaff" stop-opacity="0.55"/>
        <stop offset="70%" stop-color="#b9dcff" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>

      <linearGradient id="waveGrad2" x1="1" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e6f3ff" stop-opacity="0.75"/>
        <stop offset="45%" stop-color="#cfe8ff" stop-opacity="0.4"/>
        <stop offset="75%" stop-color="#b0d6ff" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>

    </defs>

    <!-- WAVE 1 -->
    <path fill="url(#waveGrad1)">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="
        M0,520 C500,450 900,650 1440,520 L1440,900 L0,900 Z;
        M0,540 C480,620 980,420 1440,560 L1440,900 L0,900 Z;
        M0,520 C500,450 900,650 1440,520 L1440,900 L0,900 Z
        " />
    </path>

    <!-- WAVE 2 -->
    <path fill="url(#waveGrad2)">
      <animate attributeName="d" dur="18s" repeatCount="indefinite"
        values="
        M0,600 C600,700 1000,480 1440,620 L1440,900 L0,900 Z;
        M0,620 C520,500 1100,720 1440,580 L1440,900 L0,900 Z;
        M0,600 C600,700 1000,480 1440,620 L1440,900 L0,900 Z
        " />
    </path>

  </svg>
</div>

<div class="container">

  <div class="hero">
    <h1>Artur Tigirlas</h1>
    <p>Photography • Projects • Blog • Archive</p>
  </div>

  <div class="blog">

    <div class="card" onclick="toggle(this)">
      <div class="card-header">
        <div>
          <div class="title">First Entry</div>
          <div class="meta">June 3 2026</div>
        </div>
        <div>＋</div>
      </div>

      <div class="card-body">
        Wave system restored. Clean glass UI with visible soft gradient background.
      </div>
    </div>

  </div>

  <div class="sidebar">

    <div class="widget">
      <h3>Navigation</h3>
      <a class="btn" href="photos.html">📁 Photos</a>
      <a class="btn" href="projects.html">🧩 Projects</a>
      <a class="btn" href="portfolio.html">🖼 Portfolio</a>
    </div>

    <div class="widget">
      <h3>Calendar</h3>
      <div class="calendar">
        Mon Tue Wed<br>
        Thu Fri Sat<br>
        Sun
      </div>
    </div>

  </div>

</div>

<script>

function toggle(el){
  el.classList.toggle("open");
}

function togglePixel(){
  document.body.classList.toggle("pixel");
}

document.querySelectorAll(".card").forEach(card=>{
  card.addEventListener("click", function(e){

    const ripple = document.createElement("span");
    ripple.classList.add("ripple");

    const rect = this.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);

    ripple.style.width = ripple.style.height = size + "px";
    ripple.style.left = e.clientX - rect.left - size/2 + "px";
    ripple.style.top = e.clientY - rect.top - size/2 + "px";

    this.appendChild(ripple);
    setTimeout(()=> ripple.remove(), 700);
  });
});

</script>

</body>
</html>
