<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pond Gallery — Artur Tigirlas</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --sand-light: #eadab7;
      --sand-mid: #dbc395;
      --sand-deep: #c8a974;
      --shore-shadow: rgba(84, 67, 42, 0.15);
      --water-light: #aee2ee;
      --water-top: #88d2e2;
      --water-middle: #5cbfd7;
      --water-deep: #338eab;
      --ink: #163542;
      --paper: #f6efe4;
      --water-shadow: rgba(18, 82, 104, 0.22);
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: "Times New Roman", Times, serif;
      color: var(--ink);
      background: var(--water-middle);
    }

    button,
    a {
      font: inherit;
    }

    .pond {
      position: fixed;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 18% 16%, rgba(255, 255, 255, 0.18), transparent 18%),
        radial-gradient(circle at 76% 26%, rgba(255, 255, 255, 0.12), transparent 16%),
        linear-gradient(180deg, rgba(188, 232, 241, 0.34), rgba(38, 127, 160, 0.52)),
        url("assets/water-texture.png") center / cover no-repeat;
      background-blend-mode: screen, screen, soft-light, normal;
    }

    .pond::before,
    .pond::after {
      content: "";
      position: absolute;
      inset: -12%;
      pointer-events: none;
      z-index: 0;
    }

    .pond::before {
      opacity: 0.34;
      background:
        radial-gradient(ellipse at 18% 22%, rgba(255, 255, 255, 0.26), transparent 24%),
        radial-gradient(ellipse at 64% 32%, rgba(255, 255, 255, 0.15), transparent 22%),
        radial-gradient(ellipse at 78% 76%, rgba(14, 102, 137, 0.22), transparent 30%);
      filter: blur(18px);
      mix-blend-mode: screen;
      animation: waterGlow 16s ease-in-out infinite alternate;
    }

    .pond::after {
      opacity: 0.2;
      background:
        radial-gradient(ellipse at 30% 42%, rgba(255, 255, 255, 0.20), transparent 18%),
        radial-gradient(ellipse at 76% 56%, rgba(255, 255, 255, 0.13), transparent 18%),
        radial-gradient(ellipse at 46% 82%, rgba(255, 255, 255, 0.10), transparent 16%);
      filter: blur(24px);
      mix-blend-mode: soft-light;
      animation: waterGlow 22s ease-in-out infinite alternate-reverse;
    }

    .water-surface,
    .water-caustics,
    .water-grain,
    .water-halftone,
    .sand-halftone {
      position: absolute;
      inset: -10%;
      z-index: 1;
      pointer-events: none;
    }

    .water-surface {
      opacity: 0.22;
      background:
        linear-gradient(125deg, transparent 0 28%, rgba(255, 255, 255, 0.18) 38%, transparent 52%),
        linear-gradient(145deg, transparent 0 62%, rgba(255, 255, 255, 0.12) 72%, transparent 84%);
      mix-blend-mode: screen;
      filter: blur(7px);
      animation: surfaceDrift 24s ease-in-out infinite alternate;
    }

    .water-caustics {
      opacity: 0.16;
      background:
        radial-gradient(ellipse at 22% 24%, rgba(255, 255, 255, 0.30), transparent 20%),
        radial-gradient(ellipse at 66% 42%, rgba(255, 255, 255, 0.20), transparent 18%),
        radial-gradient(ellipse at 78% 74%, rgba(255, 255, 255, 0.22), transparent 16%),
        radial-gradient(ellipse at 34% 68%, rgba(255, 255, 255, 0.16), transparent 18%);
      filter: blur(30px);
      mix-blend-mode: screen;
      animation: causticDrift 19s ease-in-out infinite alternate-reverse;
    }

    @keyframes waterGlow {
      from {
        transform: translate3d(-1.5%, 0, 0) scale(1.02);
      }
      to {
        transform: translate3d(2%, -1.4%, 0) scale(1.08);
      }
    }

    @keyframes surfaceDrift {
      from {
        transform: translate3d(-2%, 0, 0) scale(1.02);
      }
      to {
        transform: translate3d(2%, -1%, 0) scale(1.06);
      }
    }

    @keyframes causticDrift {
      from {
        transform: translateY(0) scale(1);
      }
      to {
        transform: translateY(-1.2%) scale(1.06);
      }
    }

    @keyframes waterDotsWave {
      0% {
        transform: translate3d(0, 0, 0) scale(1);
      }
      25% {
        transform: translate3d(0.7%, -0.45%, 0) scale(1.018);
      }
      50% {
        transform: translate3d(1.1%, 0.25%, 0) scale(1.025);
      }
      75% {
        transform: translate3d(0.4%, -0.3%, 0) scale(1.014);
      }
      100% {
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    @keyframes waterPatchFloat {
      0% {
        transform: translate3d(-6px, 0, 0) scale(1);
      }
      50% {
        transform: translate3d(6px, -1px, 0) scale(1.018);
      }
      100% {
        transform: translate3d(-6px, 0, 0) scale(1);
      }
    }

    .water-grain {
      opacity: 0.14;
      background:
        radial-gradient(circle at 28% 32%, rgba(255,255,255,0.13), transparent 18%),
        radial-gradient(circle at 72% 58%, rgba(255,255,255,0.08), transparent 15%),
        linear-gradient(160deg, transparent 0 38%, rgba(255,255,255,0.05) 46%, transparent 58%);
      mix-blend-mode: screen;
      filter: blur(1px);
      animation: waterDotsWave 10s ease-in-out infinite;
    }

    .water-halftone {
      inset: 140px 0 0;
      width: 100%;
      height: calc(100% - 140px);
      opacity: .22;
      overflow: hidden;
      mix-blend-mode: multiply;
      animation: waterShadowDrift 13s ease-in-out infinite alternate;
    }

    .water-halftone svg {
      width: 108%;
      height: 108%;
      display: block;
      transform: translate(-4%, -4%);
      overflow: visible;
    }

    .water-halftone circle {
      fill: #064a69;
    }

    @keyframes waterShadowDrift {
      from {
        transform: translate3d(-0.7%, 0.35%, 0) scale(1.01);
      }
      to {
        transform: translate3d(0.8%, -0.5%, 0) scale(1.025);
      }
    }

    .shore {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      height: 140px;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.14), rgba(185,143,83,0.08)),
        url("assets/sand-texture.png") center 46% / cover no-repeat,
        linear-gradient(180deg, var(--sand-light), var(--sand-deep));
      background-blend-mode: screen, multiply, normal;
      box-shadow: 0 8px 20px rgba(74, 57, 37, 0.14);
      clip-path: polygon(0 0, 100% 0, 100% 72%, 91% 78%, 82% 75%, 72% 83%, 63% 77%, 52% 87%, 42% 81%, 31% 88%, 20% 80%, 10% 86%, 0 80%);
      overflow: visible;
    }

    .shore::before {
      content: "";
      position: absolute;
      left: -2%;
      right: -2%;
      bottom: -40px;
      height: 72px;
      background:
        linear-gradient(180deg, rgba(236, 217, 176, 0.82) 0%, rgba(226, 199, 149, 0.5) 30%, rgba(154, 205, 219, 0.16) 58%, rgba(255,255,255,0.06) 76%, transparent 100%);
      filter: blur(10px);
      opacity: 0.95;
      mix-blend-mode: screen;
    }

    .shore::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0;
    }

    .sand-halftone {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      z-index: 31;
      height: 138px;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.55;
      mix-blend-mode: multiply;
      animation: sandWind 9.5s ease-in-out infinite;
    }

    .sand-halftone svg {
      width: 106%;
      height: 100%;
      display: block;
      transform: translateX(-3%);
      overflow: visible;
    }

    .sand-halftone circle {
      fill: rgba(110, 78, 40, 0.68);
    }

    @keyframes sandWind {
      0% {
        transform: translate3d(-14px, 0, 0) scale(1);
      }
      50% {
        transform: translate3d(16px, -1px, 0) scale(1.04);
      }
      100% {
        transform: translate3d(-14px, 0, 0) scale(1);
      }
    }

    .toolbar {
      position: fixed;
      top: 18px;
      left: 50%;
      z-index: 40;
      width: min(780px, calc(100% - 36px));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      border: 1px solid rgba(112, 88, 53, 0.22);
      border-radius: 4px;
      background: rgba(244, 236, 219, 0.84);
      box-shadow: 0 4px 18px rgba(101, 82, 54, 0.1);
      backdrop-filter: blur(4px);
      pointer-events: auto;
    }

    .toolbar a,
    .toolbar button {
      border: 0;
      color: var(--ink);
      background: none;
      text-decoration: none;
      cursor: pointer;
      font-size: 17px;
    }

    .toolbar strong {
      font-size: 30px;
      font-weight: normal;
      letter-spacing: 0.02em;
    }

    .toolbar-note {
      opacity: 0.78;
      font-size: 14px;
      max-width: 250px;
      text-align: center;
    }

    .scene {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      z-index: 10;
      pointer-events: none;
    }

    .ripple-ring {
      position: absolute;
      left: 0;
      top: 0;
      width: 50px;
      height: 18px;
      margin-left: -25px;
      margin-top: -9px;
      border: 1.4px solid rgba(255, 255, 255, 0.74);
      border-radius: 50%;
      opacity: 0;
      transform: scale(0.35, 0.22);
      animation: rippleOut 3.8s ease-out forwards;
      animation-delay: var(--delay, 0s);
    }

    @keyframes rippleOut {
      0% {
        opacity: 0;
        transform: scale(0.35, 0.22);
      }
      10% {
        opacity: 0.92;
      }
      62% {
        opacity: 0.36;
      }
      100% {
        opacity: 0;
        transform: scale(var(--scale-x, 9.6), var(--scale-y, 4));
      }
    }

    .bubble {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--size, 10px);
      height: var(--size, 10px);
      margin-left: calc(var(--size, 10px) * -0.5);
      margin-top: calc(var(--size, 10px) * -0.5);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      opacity: 0;
      animation: bubbleRise 2.8s ease-out forwards;
      animation-delay: var(--delay, 0s);
    }

    @keyframes bubbleRise {
      0% {
        opacity: 0;
        transform: translate(0, 12px) scale(0.45);
      }
      16% {
        opacity: 0.78;
      }
      64% {
        opacity: 0.68;
        transform: translate(var(--x, 0px), var(--y, -34px)) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(calc(var(--x, 0px) * 1.15), calc(var(--y, -34px) - 26px)) scale(0.7);
      }
    }

    .floating-photo {
      --photo-width: 190px;
      --tilt: 0deg;
      --drift-x: 26px;
      --drift-y: -18px;

      position: absolute;
      z-index: 14;
      left: 0;
      top: 0;
      width: var(--photo-width);
      max-width: 26vw;
      margin: 0;
      padding: 4px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 2px;
      background: rgba(245, 251, 252, 0.2);
      box-shadow: 0 12px 24px var(--water-shadow);
      overflow: hidden;
      cursor: zoom-in;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.76) rotate(var(--tilt));
      animation: photoLife 8.8s ease-in-out forwards;
      animation-delay: 0.42s;
      will-change: transform, opacity, filter;
      pointer-events: auto;
    }

    .floating-photo img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 30vh;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .floating-photo::after {
      content: "";
      position: absolute;
      left: -12%;
      right: -12%;
      bottom: -18px;
      height: 20px;
      background: radial-gradient(ellipse at center, rgba(16, 81, 102, 0.22), transparent 68%);
      pointer-events: none;
    }

    .floating-photo:hover {
      z-index: 18;
      border-color: rgba(255, 255, 255, 0.94);
    }

    @keyframes photoLife {
      0% {
        opacity: 0;
        filter: blur(4px) saturate(0.8);
        transform: translate(-50%, -46%) scale(0.72) rotate(var(--tilt));
      }
      16% {
        opacity: 1;
        filter: blur(0) saturate(1);
        transform: translate(-50%, -58%) scale(1) rotate(var(--tilt));
      }
      68% {
        opacity: 0.94;
        filter: blur(0) saturate(0.98);
        transform: translate(calc(-50% + var(--drift-x) * 0.65), calc(-58% + var(--drift-y) * 0.65)) scale(0.98) rotate(var(--tilt));
      }
      86% {
        opacity: 0.38;
        filter: blur(1.2px) saturate(0.76);
        transform: translate(calc(-50% + var(--drift-x)), calc(-48% + var(--drift-y))) scale(0.88) rotate(var(--tilt));
      }
      100% {
        opacity: 0;
        filter: blur(4px) saturate(0.6);
        transform: translate(calc(-50% + var(--drift-x) * 1.2), calc(-14% + var(--drift-y) * 1.2)) scale(0.62) rotate(var(--tilt));
      }
    }

    .empty-message {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 20;
      width: min(440px, calc(100% - 44px));
      transform: translate(-50%, -50%);
      padding: 22px;
      border: 1px solid rgba(21, 56, 69, 0.25);
      background: rgba(246, 239, 228, 0.82);
      text-align: center;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: none;
      place-items: center;
      padding: 40px 24px 28px;
      background: rgba(5, 24, 31, 0.9);
      cursor: zoom-out;
    }

    .lightbox.open {
      display: grid;
    }

    .lightbox figure {
      max-width: 94vw;
      margin: 0;
      text-align: center;
    }

    .lightbox img {
      display: block;
      max-width: 94vw;
      max-height: 84vh;
      object-fit: contain;
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    .lightbox figcaption {
      margin-top: 11px;
      color: white;
      font-size: 17px;
    }

    @media (max-width: 760px) {
      .toolbar {
        width: calc(100% - 18px);
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px 12px;
      }

      .toolbar strong {
        width: 100%;
        text-align: center;
        font-size: 24px;
      }

      .toolbar-note {
        max-width: none;
      }

      .floating-photo {
        max-width: 38vw;
      }

      .floating-photo img {
        max-height: 24vh;
      }
    }

    @media (max-width: 540px) {
      .shore {
        height: 154px;
      }

      .toolbar {
        top: 12px;
        padding: 10px 12px;
      }

      .floating-photo {
        max-width: 44vw;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .pond::before,
      .pond::after,
      .water-surface,
      .water-caustics,
      .water-grain,
      .water-halftone,
      .sand-halftone,
      .sand-halftone::before,
      .sand-halftone::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main id="pond" class="pond" aria-label="Automatic ripple photo gallery">
    <div class="water-surface"></div>
    <div class="water-caustics"></div>
    <div class="water-grain"></div>
    <div class="water-halftone"></div>
    <div class="shore"></div>
    <div class="sand-halftone"></div>

    <nav class="toolbar">
      <a href="travel-menu.html">← Travel</a>
      <strong>Pond Gallery</strong>
      <span class="toolbar-note">A few ripples appear on their own — click a photo to enlarge it</span>
      <button id="nextButton" type="button">Ripple now</button>
    </nav>

    <p id="emptyMessage" class="empty-message" hidden>
      Add JPG, JPEG, PNG, or WEBP files to <strong>photos/travel-photos</strong>, run
      <strong>update-photos.bat</strong>, then refresh this page.
    </p>
  </main>

  <div id="lightbox" class="lightbox" aria-hidden="true">
    <figure>
      <img id="largeImage" alt="Selected travel photograph">
      <figcaption id="largeDate"></figcaption>
    </figure>
  </div>

  <script src="photos-data.js"></script>
  <script>
    const pond = document.getElementById("pond");
    const nextButton = document.getElementById("nextButton");
    const emptyMessage = document.getElementById("emptyMessage");
    const lightbox = document.getElementById("lightbox");
    const largeImage = document.getElementById("largeImage");
    const largeDate = document.getElementById("largeDate");

    const sourcePhotos = Array.isArray(window.TRAVEL_PHOTOS)
      ? [...window.TRAVEL_PHOTOS]
      : [];

    const maximumScenes = 3;
    const minimumDistanceBetweenScenes = 260;

    let photoQueue = [];
    let activeScenes = [];
    let automaticTimer = null;

    function shuffle(items) {
      const copy = [...items];
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[randomIndex]] = [copy[randomIndex], copy[index]];
      }
      return copy;
    }

    function refillQueue() {
      photoQueue = shuffle(sourcePhotos);
    }

    function buildWaterHalftone() {
      const layer = document.querySelector(".water-halftone");
      if (!layer) return;

      const width = Math.max(window.innerWidth, 900);
      const height = Math.max(window.innerHeight - 140, 520);
      const namespace = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(namespace, "svg");
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.setAttribute("preserveAspectRatio", "none");
      svg.setAttribute("aria-hidden", "true");

      /* Broad halftone shadows that read like dark water, not printed stickers. */
      const clusters = [
        { x: width * 0.12, y: height * 0.42, strength: 1.08, spreadX: width * 0.15, spreadY: height * 0.18 },
        { x: width * 0.30, y: height * 0.68, strength: 0.92, spreadX: width * 0.18, spreadY: height * 0.20 },
        { x: width * 0.52, y: height * 0.48, strength: 0.72, spreadX: width * 0.16, spreadY: height * 0.17 },
        { x: width * 0.72, y: height * 0.74, strength: 0.98, spreadX: width * 0.18, spreadY: height * 0.20 },
        { x: width * 0.90, y: height * 0.36, strength: 0.78, spreadX: width * 0.13, spreadY: height * 0.16 }
      ];

      const step = width < 800 ? 13 : 15;
      for (let y = step / 2; y < height; y += step) {
        for (let x = step / 2; x < width; x += step) {
          let field = 0;

          clusters.forEach((cluster) => {
            const dx = x - cluster.x;
            const dy = y - cluster.y;
            const exponent = -(
              (dx * dx) / (2 * cluster.spreadX * cluster.spreadX) +
              (dy * dy) / (2 * cluster.spreadY * cluster.spreadY)
            );
            field += cluster.strength * Math.exp(exponent);
          });

          /* A gentle wave modulation breaks up the circular cluster shapes. */
          field *= 0.76 + 0.24 * Math.sin(x * 0.018 + y * 0.027);
          field += Math.random() * 0.035;

          if (field < 0.16) continue;

          const radius = Math.min(step * 0.40, 0.45 + field * 3.1);
          const opacity = Math.min(0.58, 0.08 + field * 0.31);
          const circle = document.createElementNS(namespace, "circle");
          circle.setAttribute("cx", x);
          circle.setAttribute("cy", y);
          circle.setAttribute("r", radius.toFixed(2));
          circle.setAttribute("fill", `rgba(4, 57, 84, ${opacity.toFixed(3)})`);
          svg.appendChild(circle);
        }
      }

      layer.replaceChildren(svg);
    }

    function buildSandHalftone() {
      const layer = document.querySelector(".sand-halftone");
      if (!layer) return;

      const width = Math.max(window.innerWidth, 1200);
      const height = 138;
      const namespace = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(namespace, "svg");
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.setAttribute("preserveAspectRatio", "none");
      svg.setAttribute("aria-hidden", "true");

      const clusters = [
        { x: width * 0.08, y: 30, strength: 0.96, spreadX: width * 0.08, spreadY: 18 },
        { x: width * 0.22, y: 44, strength: 1.06, spreadX: width * 0.10, spreadY: 24 },
        { x: width * 0.38, y: 32, strength: 0.88, spreadX: width * 0.09, spreadY: 18 },
        { x: width * 0.52, y: 48, strength: 1.02, spreadX: width * 0.11, spreadY: 24 },
        { x: width * 0.68, y: 36, strength: 0.86, spreadX: width * 0.09, spreadY: 20 },
        { x: width * 0.82, y: 28, strength: 0.94, spreadX: width * 0.08, spreadY: 18 },
        { x: width * 0.94, y: 42, strength: 0.78, spreadX: width * 0.07, spreadY: 20 }
      ];

      const step = width < 800 ? 13 : 15;

      for (let y = 8; y <= height - 10; y += step) {
        for (let x = 8; x <= width - 8; x += step) {
          let field = 0;

          clusters.forEach((cluster) => {
            const dx = x - cluster.x;
            const dy = y - cluster.y;
            const exponent = -(
              (dx * dx) / (2 * cluster.spreadX * cluster.spreadX) +
              (dy * dy) / (2 * cluster.spreadY * cluster.spreadY)
            );
            field += cluster.strength * Math.exp(exponent);
          });

          field *= 0.84 + 0.16 * Math.sin(x * 0.035 - y * 0.12);
          field += Math.random() * 0.03;

          if (field < 0.14) continue;

          const radius = Math.min(step * 0.42, 0.55 + field * 2.9);
          const opacity = Math.min(0.58, 0.10 + field * 0.28);
          const circle = document.createElementNS(namespace, "circle");
          circle.setAttribute("cx", x);
          circle.setAttribute("cy", y);
          circle.setAttribute("r", radius.toFixed(2));
          circle.setAttribute("fill", `rgba(110, 78, 40, ${opacity.toFixed(3)})`);
          svg.appendChild(circle);
        }
      }

      layer.replaceChildren(svg);
    }

    function getNextPhoto() {
      if (!photoQueue.length) {
        refillQueue();
      }
      return photoQueue.shift();
    }

    function distanceBetween(pointA, pointB) {
      const dx = pointA.x - pointB.x;
      const dy = pointA.y - pointB.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function getRandomPoint() {
      const horizontalMargin = Math.min(190, window.innerWidth * 0.18);
      const topMargin = Math.max(228, window.innerHeight * 0.26);
      const bottomMargin = Math.min(130, window.innerHeight * 0.16);

      for (let attempt = 0; attempt < 30; attempt += 1) {
        const point = {
          x: horizontalMargin + Math.random() * (window.innerWidth - horizontalMargin * 2),
          y: topMargin + Math.random() * (window.innerHeight - topMargin - bottomMargin)
        };

        const tooClose = activeScenes.some((scene) => {
          return distanceBetween(point, scene.point) < minimumDistanceBetweenScenes;
        });

        if (!tooClose) {
          return point;
        }
      }

      return {
        x: horizontalMargin + Math.random() * (window.innerWidth - horizontalMargin * 2),
        y: topMargin + Math.random() * (window.innerHeight - topMargin - bottomMargin)
      };
    }

    function openLightbox(photo) {
      largeImage.src = photo.src;
      largeDate.textContent = photo.date || "Date unavailable";
      lightbox.classList.add("open");
      lightbox.setAttribute("aria-hidden", "false");
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      lightbox.setAttribute("aria-hidden", "true");
    }

    function removeScene(sceneElement) {
      activeScenes = activeScenes.filter((scene) => scene.element !== sceneElement);
      sceneElement.remove();
    }

    function createRippleScene() {
      if (!sourcePhotos.length || lightbox.classList.contains("open")) {
        return;
      }

      if (activeScenes.length >= maximumScenes) {
        return;
      }

      const point = getRandomPoint();
      const photo = getNextPhoto();
      const scene = document.createElement("section");
      const figure = document.createElement("figure");
      const image = document.createElement("img");

      scene.className = "scene";
      scene.style.left = `${point.x}px`;
      scene.style.top = `${point.y}px`;

      for (let index = 0; index < 4; index += 1) {
        const ring = document.createElement("span");
        ring.className = "ripple-ring";
        ring.style.setProperty("--delay", `${index * 0.26}s`);
        ring.style.setProperty("--scale-x", `${8.6 + index * 1.45}`);
        ring.style.setProperty("--scale-y", `${3.4 + index * 0.62}`);
        scene.appendChild(ring);
      }

      const bubbleCount = 9;
      for (let index = 0; index < bubbleCount; index += 1) {
        const bubble = document.createElement("span");
        const angle = Math.random() * Math.PI * 2;
        const distance = 34 + Math.random() * 84;
        bubble.className = "bubble";
        bubble.style.setProperty("--size", `${8 + Math.round(Math.random() * 8)}px`);
        bubble.style.setProperty("--x", `${Math.cos(angle) * distance}px`);
        bubble.style.setProperty("--y", `${Math.sin(angle) * distance * 0.44 - 18}px`);
        bubble.style.setProperty("--delay", `${0.24 + Math.random() * 0.6}s`);
        scene.appendChild(bubble);
      }

      const photoWidth = Math.round(150 + Math.random() * 110);
      const tilt = (-3 + Math.random() * 6).toFixed(2);
      const driftX = Math.round(-44 + Math.random() * 88);
      const driftY = Math.round(-20 + Math.random() * 30);

      figure.className = "floating-photo";
      figure.style.setProperty("--photo-width", `${photoWidth}px`);
      figure.style.setProperty("--tilt", `${tilt}deg`);
      figure.style.setProperty("--drift-x", `${driftX}px`);
      figure.style.setProperty("--drift-y", `${driftY}px`);

      image.src = photo.src;
      image.alt = `Travel photograph from ${photo.date || "an unknown date"}`;
      image.loading = "eager";

      figure.appendChild(image);
      scene.appendChild(figure);
      pond.appendChild(scene);
      activeScenes.push({ element: scene, point });

      figure.addEventListener("click", (event) => {
        event.stopPropagation();
        openLightbox(photo);
      });

      figure.addEventListener(
        "animationend",
        () => {
          removeScene(scene);
        },
        { once: true }
      );
    }

    function startAutomaticRipples() {
      clearInterval(automaticTimer);
      automaticTimer = window.setInterval(() => {
        if (lightbox.classList.contains("open")) {
          return;
        }

        if (activeScenes.length < maximumScenes) {
          createRippleScene();
        }
      }, 1850);
    }

    nextButton.addEventListener("click", () => {
      createRippleScene();
    });

    lightbox.addEventListener("click", closeLightbox);

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && lightbox.classList.contains("open")) {
        closeLightbox();
      }

      if (event.key === "ArrowRight" && !lightbox.classList.contains("open")) {
        createRippleScene();
      }
    });

    buildWaterHalftone();
    buildSandHalftone();

    window.addEventListener("resize", () => {
      buildWaterHalftone();
      buildSandHalftone();
    });

    if (sourcePhotos.length) {
      window.setTimeout(createRippleScene, 550);
      window.setTimeout(createRippleScene, 1450);
      startAutomaticRipples();
    } else {
      emptyMessage.hidden = false;
    }
  </script>
</body>
</html>
